  <style>
      #app-boot{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:#07100d;color:#b8ff5a;transition:opacity .22s ease,visibility .22s ease;font-family:monospace}
      #app-boot.boot-done{opacity:0;visibility:hidden;pointer-events:none}
      #app-boot>div{grid-area:1/1}.boot-mark{font:800 4rem/1 system-ui;letter-spacing:-.08em}.boot-track{width:140px;height:2px;margin-top:105px;background:rgba(184,255,90,.15);overflow:hidden}.boot-track span{display:block;width:45%;height:100%;background:#b8ff5a;animation:bootload .7s ease-in-out infinite alternate}.boot-track+small{position:absolute;bottom:28px;font-size:9px;letter-spacing:.18em;opacity:.55}@keyframes bootload{from{transform:translateX(-110%)}to{transform:translateX(330%)}}
      @media(prefers-reduced-motion:reduce){#app-boot{transition:none}.boot-track span{animation:none;width:100%}}
    </style>
  </head>
  <body>
